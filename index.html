<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marca-texto</title>
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --ink:#172338; --ink-2:#4E5A6E; --rule:#D3D9E2;
  --marca:#F7DF45; --marca-ink:#172338;
  --ok:#17784F; --ok-bg:#E2F2E9; --erro:#B23A25; --erro-bg:#FBE8E3; --dica-bg:#FFF7D1;
  --fita:#172338; --fita-ink:#FFFFFF; --foco:#2B63D9; --btn:#172338; --btn-ink:#FFFFFF;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141B; --sheet:#18202B; --ink:#E6EAF0; --ink-2:#9DA8B8; --rule:#2B3545;
    --marca:#E9CF3D; --marca-ink:#10151C;
    --ok:#52C892; --ok-bg:#153026; --erro:#F2846F; --erro-bg:#3A201B; --dica-bg:#2E2A14;
    --fita:#E6EAF0; --fita-ink:#10151C; --foco:#86AAFF; --btn:#E6EAF0; --btn-ink:#10151C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141B; --sheet:#18202B; --ink:#E6EAF0; --ink-2:#9DA8B8; --rule:#2B3545;
  --marca:#E9CF3D; --marca-ink:#10151C;
  --ok:#52C892; --ok-bg:#153026; --erro:#F2846F; --erro-bg:#3A201B; --dica-bg:#2E2A14;
  --fita:#E6EAF0; --fita-ink:#10151C; --foco:#86AAFF; --btn:#E6EAF0; --btn-ink:#10151C;
  color-scheme: dark;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
*,*::before,*::after{ box-sizing: border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:1.0625rem; line-height:1.55; -webkit-text-size-adjust:100%; }
a{ color:inherit; text-underline-offset:.18em; }
svg{ width:1.25rem; height:1.25rem; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
:focus-visible{ outline:3px solid var(--foco); outline-offset:2px; border-radius:.3rem; }
p{ margin:0 0 .75rem; }
h1,h2{ font-family:var(--serif); font-weight:600; line-height:1.2; margin:0; }

.wrap{ max-width:40rem; margin:0 auto; padding:.5rem 1.125rem 7rem; }

/* topo */
.topo{ display:flex; align-items:center; justify-content:space-between; padding:.75rem 0 1.25rem; }
.logo{ font-family:var(--serif); font-weight:700; font-size:1.3rem; text-decoration:none; letter-spacing:-.01em; }
.ajustes-link{ display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; color:var(--ink-2); }
.ajustes-link:hover{ color:var(--ink); }

/* o marca-texto: o único gesto ousado */
.marca{
  color:var(--marca-ink);
  background-image:linear-gradient(100deg, transparent .1em, var(--marca) .28em, var(--marca) calc(100% - .32em), transparent calc(100% - .08em));
  background-repeat:no-repeat; background-size:100% 86%; background-position:0 62%;
  padding:0 .28em; margin:0 -.1em;
  -webkit-box-decoration-break:clone; box-decoration-break:clone;
  border-radius:.25em .55em .3em .6em;
}

/* fita de página (marcador de livro) */
.fita{
  display:inline-flex; align-items:center; vertical-align:.1em;
  font:700 .78rem/1 var(--sans); letter-spacing:.01em;
  background:var(--fita); color:var(--fita-ink);
  padding:.36em 1em .36em .55em; white-space:nowrap;
  clip-path:polygon(0 0,100% 0,calc(100% - .5em) 50%,100% 100%,0 100%);
}

/* botões */
.btn,.btn-sec{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  min-height:48px; padding:.65rem 1.15rem; border-radius:.6rem;
  font:700 1rem/1.2 var(--sans); text-decoration:none; cursor:pointer;
}
.btn{ background:var(--btn); color:var(--btn-ink); border:0; }
.btn-sec{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
.btn[disabled],.btn-sec[disabled]{ opacity:.45; cursor:not-allowed; }
.btn.perigo{ background:var(--erro); color:#fff; }
.link{ background:none; border:0; padding:.5rem; font:700 1rem var(--sans); color:var(--ink); text-decoration:underline; cursor:pointer; min-height:44px; }

/* blocos */
.folha{ background:var(--sheet); border:1px solid var(--rule); border-radius:.9rem; padding:1.1rem 1.1rem 1.15rem; margin:0 0 1.25rem; }
.lead{ font-size:1.0625rem; color:var(--ink-2); }
.nota{ font-size:.92rem; color:var(--ink-2); }
.sec{ font-size:1.15rem; margin:2rem 0 .75rem; }
.tit-pag{ font-size:1.75rem; margin:0 0 .5rem; }
.rot{ font-family:var(--sans); font-size:.92rem; font-weight:700; color:var(--ink-2); margin:0 0 .35rem; }
.aviso{ border-radius:.6rem; padding:.7rem .85rem; margin:.75rem 0; font-size:.98rem; }
.aviso p{ margin:0; }
.aviso.erro{ background:var(--erro-bg); color:var(--ink); border-left:4px solid var(--erro); }
.aviso.dica{ background:var(--dica-bg); border-left:4px solid var(--marca); }
.linha{ display:flex; gap:.6rem; flex-wrap:wrap; }

/* entrada */
.entrada h1{ font-size:2rem; margin:.5rem 0 .75rem; }
.soltar{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:.35rem; padding:2rem 1rem; margin:1.25rem 0 1.5rem; border:2px dashed var(--ink-2); border-radius:1rem; background:var(--sheet); cursor:pointer; }
.soltar input{ position:absolute; width:1px; height:1px; opacity:0; }
.soltar:focus-within{ outline:3px solid var(--foco); outline-offset:3px; }
.soltar-tit{ font:600 1.35rem var(--serif); }
.soltar-tit::after{ content:""; display:block; height:.35em; margin-top:-.15em; background:var(--marca); border-radius:.3em .6em .3em .7em; opacity:.85; }
.soltar-sub{ font-size:.92rem; color:var(--ink-2); max-width:22rem; }
.como{ padding-left:1.4rem; margin:0; }
.como li{ margin:0 0 .6rem; padding-left:.2rem; }
.barra{ height:.55rem; background:var(--rule); border-radius:1rem; overflow:hidden; margin:.5rem 0 .75rem; }
.barra span{ display:block; height:100%; background:var(--marca); border-radius:1rem; transition:width .2s; }

/* hoje */
.abre{ margin:.25rem 0 1.5rem; }
.abre h1{ font-size:clamp(1.85rem, 7vw, 2.4rem); letter-spacing:-.015em; }
.abre-sub{ color:var(--ink-2); margin-top:.45rem; }
.hoje-n{ font-weight:700; color:var(--ink-2); margin:0; }
.hoje-tit{ font:600 1.45rem/1.25 var(--serif); margin:.1rem 0 .35rem; }
.hoje-meta{ display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; color:var(--ink-2); font-size:.95rem; margin-bottom:1rem; }
.segs{ display:inline-flex; gap:3px; }
.segs i{ width:1.15rem; height:.4rem; border-radius:.2rem; background:var(--rule); }
.segs i.on{ background:var(--marca); box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
.atraso{ margin:-.25rem 0 1.25rem; font-size:.98rem; }
.avs{ list-style:none; margin:0; padding:0; border-top:1px solid var(--rule); }
.av a{ display:grid; gap:.1rem; padding:.85rem .1rem; border-bottom:1px solid var(--rule); text-decoration:none; }
.av-nome{ font-weight:700; }
.av-desc{ color:var(--ink-2); font-size:.95rem; }
.av-st{ font-size:.92rem; }
.plano summary{ cursor:pointer; font-weight:700; padding:.6rem 0; min-height:44px; }
.plano-l{ list-style:none; margin:0; padding:0; }
.plano-l li{ display:grid; grid-template-columns:7.5rem 1fr auto; gap:.6rem; align-items:baseline; padding:.55rem 0; border-bottom:1px solid var(--rule); font-size:.95rem; }
.plano-d{ color:var(--ink-2); font-variant-numeric:tabular-nums; }
.plano-l li.feito a{ color:var(--ink-2); }
.plano-ok{ color:var(--ok); }

/* temas */
.temas{ list-style:none; margin:0; padding:0; }
.tema-l{ display:flex; gap:.9rem; padding:.9rem .1rem; border-bottom:1px solid var(--rule); text-decoration:none; }
.tema-n{ font:600 1.5rem/1 var(--serif); width:1.8rem; text-align:right; color:var(--ink-2); padding-top:.15rem; }
.tema-l.feito .tema-n{ color:var(--ok); }
.tema-c{ display:grid; gap:.15rem; }
.tema-t{ font:600 1.1rem/1.3 var(--serif); }
.tema-m{ font-size:.9rem; color:var(--ink-2); }
.tema-s{ font-size:.9rem; display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }

/* tema */
.voltar{ display:inline-flex; align-items:center; gap:.2rem; font-weight:700; text-decoration:none; color:var(--ink-2); min-height:44px; margin:-.5rem 0 .5rem -.25rem; }
.tema-cab h1{ font-size:clamp(1.7rem, 6.5vw, 2.2rem); margin:.15rem 0 .5rem; }
.tema-rot{ font-weight:700; color:var(--ink-2); margin:0; }
.tema-info{ color:var(--ink-2); }
.metas{ margin:0 0 1.25rem; }
.metas summary{ cursor:pointer; font-weight:700; padding:.6rem 0; }
.metas ul{ margin:.25rem 0 0; padding-left:1.2rem; color:var(--ink-2); }
.etapas{ list-style:none; margin:0; padding:0; }
.etapa{ border-top:1px solid var(--rule); }
.etapa:last-child{ border-bottom:1px solid var(--rule); }
.etapa summary{ display:flex; align-items:center; gap:.8rem; padding:1rem 0; cursor:pointer; list-style:none; min-height:56px; }
.etapa summary::-webkit-details-marker{ display:none; }
.etapa summary::after{ content:""; margin-left:auto; width:.55rem; height:.55rem; border-right:2px solid var(--ink-2); border-bottom:2px solid var(--ink-2); transform:rotate(45deg) translateY(-.15rem); }
.etapa details[open] summary::after{ transform:rotate(-135deg) translateY(-.1rem); }
.etapa-n{ display:inline-flex; align-items:center; justify-content:center; width:2rem; height:2rem; border-radius:50%; border:1.5px solid var(--ink); font:700 .95rem var(--sans); flex:none; }
.etapa.feita .etapa-n{ background:var(--ok); border-color:var(--ok); color:var(--sheet); }
.etapa.feita .etapa-n svg{ width:1rem; height:1rem; stroke-width:2.6; }
.etapa-nome{ font:600 1.15rem/1.3 var(--serif); }
.etapa.feita .etapa-nome{ color:var(--ink-2); }
.etapa-corpo{ padding:0 0 1.5rem; }
.etapa-corpo > .btn, .etapa-corpo > .btn-sec{ margin-top:.5rem; }

.pistas{ list-style:none; margin:.75rem 0 1.25rem; padding:0; display:grid; gap:.75rem; }
.pista{ background:var(--sheet); border:1px solid var(--rule); border-radius:.75rem; padding:.9rem .95rem; }
.pista-cab{ display:flex; justify-content:space-between; align-items:flex-start; gap:.75rem; margin-bottom:.45rem; }
.pista-cab .marca{ font:600 1.05rem/1.45 var(--serif); }
.pista-cab .fita{ margin-right:-.95rem; margin-top:.1rem; }
.pista-q{ margin:0 0 .6rem; }
.pista .btn-sec{ min-height:42px; font-size:.95rem; padding:.45rem .9rem; }
.pista-r{ border-top:1px dashed var(--rule); padding-top:.6rem; font-size:.98rem; }
.pista-r p:last-child{ margin:0; }
.pegadinha{ color:var(--ink-2); }
.pista.achada{ border-color:var(--ok); }
.provaveis ul{ list-style:none; padding:0; margin:0 0 1rem; display:grid; gap:.45rem; }
.provaveis li{ display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
.carregando{ display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; padding:.75rem 0; color:var(--ink-2); }
.carregando-g{ text-align:left; }
.pulso{ width:.8rem; height:.8rem; border-radius:50%; background:var(--marca); animation:pulso 1.2s ease-in-out infinite; }
@keyframes pulso{ 0%,100%{ transform:scale(.7); opacity:.5 } 50%{ transform:scale(1.15); opacity:1 } }
@media (prefers-reduced-motion: reduce){ .pulso{ animation:none; } .barra span{ transition:none; } }

/* questões */
.q{ background:var(--sheet); border:1px solid var(--rule); border-radius:.9rem; padding:1rem 1rem 1.1rem; margin:0 0 1rem; }
.q-rot{ font-size:.88rem; font-weight:700; color:var(--ink-2); margin:0 0 .5rem; }
.q-txt p{ font-family:var(--serif); font-size:1.02rem; line-height:1.65; }
.afirm{ list-style:none; padding:0; margin:0 0 .75rem; display:grid; gap:.5rem; }
.afirm li{ display:grid; grid-template-columns:2.1rem 1fr; gap:.25rem; font-family:var(--serif); line-height:1.6; }
.afirm b{ font-family:var(--sans); }
.afirm-vf{ display:block; font-family:var(--sans); font-size:.9rem; color:var(--ink-2); margin-top:.2rem; }
.q-cmd{ font-weight:700; margin:.25rem 0 .8rem; }
.alts-lista{ list-style:none; padding:0; margin:0; display:grid; gap:.4rem; color:var(--ink-2); font-size:.97rem; }
.alts{ display:grid; gap:.5rem; }
.alt{ display:flex; gap:.7rem; align-items:flex-start; width:100%; text-align:left; background:var(--sheet); color:var(--ink); border:1.5px solid var(--rule); border-radius:.6rem; padding:.7rem .75rem; font:inherit; font-size:.99rem; line-height:1.45; cursor:pointer; }
.alt:hover:not([disabled]){ border-color:var(--ink-2); }
.alt-l{ display:inline-flex; align-items:center; justify-content:center; width:1.75rem; height:1.75rem; border-radius:50%; border:1.5px solid var(--ink-2); font-weight:700; flex:none; }
.alt-t{ padding-top:.12rem; }
.alt-tag{ display:block; font-size:.82rem; font-weight:700; margin-top:.25rem; }
.alt.sel{ border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
.alt.sel .alt-l{ background:var(--ink); color:var(--sheet); border-color:var(--ink); }
.alt[disabled]{ cursor:default; }
.alt.riscada{ border-style:dashed; border-color:var(--erro); }
.alt.riscada .alt-t{ color:var(--ink-2); }
.alt.riscada .alt-t{ text-decoration:line-through; text-decoration-color:var(--erro); }
.alt.riscada .alt-tag{ text-decoration:none; color:var(--erro); display:inline-block; }
.alt.certa{ border-color:var(--ok); background:var(--ok-bg); opacity:1; }
.alt.certa .alt-l{ background:var(--ok); border-color:var(--ok); color:var(--sheet); }
.alt.certa .alt-tag{ color:var(--ok); }
.q-acoes{ margin-top:.9rem; }
.explica{ margin-top:.9rem; border-radius:.6rem; padding:.8rem .9rem; font-size:.98rem; }
.explica.ok{ background:var(--ok-bg); }
.explica.nao{ background:var(--erro-bg); }
.explica p:last-child{ margin:0; }
.explica-tit{ font-weight:700; display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
.explica-errada{ font-size:.95rem; }
.resumo-acertos{ font-size:1.05rem; }

/* simulados */
.sims{ list-style:none; margin:1rem 0 0; padding:0; }
.sim-c h2{ font-size:1.3rem; margin-bottom:.3rem; }
.sim-desc{ color:var(--ink-2); }
.sim-cab{ margin-bottom:1rem; }
.sim-pos{ color:var(--ink-2); font-weight:700; margin:.2rem 0 .6rem; }
.pontos{ display:flex; gap:.35rem; flex-wrap:wrap; }
.ponto{ width:1.7rem; height:1.7rem; border-radius:.35rem; border:1.5px solid var(--ink-2); background:transparent; cursor:pointer; padding:0; }
.ponto.on{ background:var(--marca); border-color:var(--marca); }
.ponto.agora{ outline:2px solid var(--ink); outline-offset:2px; }
.sim-nav{ display:flex; gap:.6rem; justify-content:space-between; margin:1rem 0; }
.sim-nav .btn,.sim-nav .btn-sec{ flex:1; }
.revisar{ margin-bottom:1rem; }
.rev{ list-style:none; padding:0; margin:0; }
.rev > li{ border-top:1px solid var(--rule); }
.rev summary{ cursor:pointer; padding:.8rem 0; min-height:48px; display:flex; align-items:center; gap:.6rem; font-weight:700; }
.rev-st{ font-size:.82rem; padding:.2rem .55rem; border-radius:1rem; }
.rev-st.ok{ background:var(--ok-bg); color:var(--ok); }
.rev-st.nao{ background:var(--erro-bg); color:var(--erro); }

/* ajustes */
.ajs h2{ font-size:1.15rem; margin-bottom:.5rem; }
.ajs label{ display:block; font-weight:700; margin:.25rem 0 .35rem; }
.ajs input[type=date]{ font:inherit; color:var(--ink); background:var(--paper); border:1.5px solid var(--rule); border-radius:.5rem; padding:.55rem .7rem; min-height:48px; margin-bottom:.9rem; width:100%; max-width:16rem; }

.ajs input[type=password]{ font:inherit; color:var(--ink); background:var(--paper); border:1.5px solid var(--rule); border-radius:.5rem; padding:.55rem .7rem; min-height:48px; margin-bottom:.75rem; width:100%; }
.passos{ padding-left:1.3rem; margin:0 0 1rem; }
.passos li{ margin-bottom:.45rem; }
.sync-ind{ display:inline-block; font-size:.85rem; font-weight:700; color:var(--ok); text-decoration:none; margin-left:.25rem; }
.sync-ind::before{ content:""; display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:currentColor; margin-right:.35rem; vertical-align:.08em; }
.sync-ind.erro{ color:var(--erro); }
/* navegação inferior */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--sheet); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom, 0px); }
.nav ul{ display:flex; max-width:40rem; margin:0 auto; padding:0; list-style:none; }
.nav li{ flex:1; }
.nav a{ display:flex; flex-direction:column; align-items:center; gap:.15rem; padding:.55rem 0 .5rem; min-height:56px; text-decoration:none; font-size:.8rem; font-weight:700; color:var(--ink-2); }
.nav a svg{ width:1.45rem; height:1.45rem; }
.nav a[aria-current="page"]{ color:var(--ink); }
.nav a[aria-current="page"] span{ background-image:linear-gradient(var(--marca), var(--marca)); background-size:100% .45em; background-position:0 88%; background-repeat:no-repeat; padding:0 .2em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topo">
    <a href="#hoje" class="logo"><span class="marca">Marca-texto</span></a>
    <a href="#ajustes" class="ajustes-link" aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </header>
  <main id="main"><p class="nota">Carregando…</p></main>
</div>
<nav class="nav" aria-label="Principal">
  <ul>
    <li><a href="#hoje" data-aba="hoje"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 14.5l2 2 4-4"/></svg><span>Hoje</span></a></li>
    <li><a href="#temas" data-aba="temas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5c3-1.3 6-1.3 9 .8 3-2.1 6-2.1 9-.8v13c-3-1.3-6-1.3-9 .8-3-2.1-6-2.1-9-.8z"/><path d="M12 6.3v13"/></svg><span>Temas</span></a></li>
    <li><a href="#simulados" data-aba="sim"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h4.5"/><path d="M14 17.2l1.4 1.4 2.6-2.7"/></svg><span>Simulados</span></a></li>
  </ul>
</nav>
<script>
/* ===== Parser do material (compartilhado com o teste em Node) ===== */
const ROMAN_RE = /^(I|II|III|IV|V|VI|VII|VIII)\s?[-–—)]\s+/;
const ALT_RE = /^([a-e])\)\s*(?:[a-e]\)\s*)?/;

function compact(t){ return t.replace(/\s+/g,''); }

function joinLines(lines){
  let out = '';
  for (let i=0;i<lines.length;i++){
    let l = lines[i].trim();
    if (!l) continue;
    if (!out) { out = l; continue; }
    if (/[a-zà-ú]-$/i.test(out) && /^[a-zà-ú]/.test(l)) { out = out.slice(0,-1) + l; }
    else if (/-$/.test(out) && /^-/.test(l)) { out = out + l.slice(1); }
    else out += ' ' + l;
  }
  return out.replace(/\s+/g,' ').trim();
}

function isNoiseLine(l){
  const s = l.trim();
  if (!s) return true;
  if (/^\d{1,3}$/.test(s)) return true;
  if (/^(\S\s){3,}\S/.test(s) && /^[A-ZÀ-Ú0-9\s]+$/.test(s)) return true;
  if (/^TEMA DE APRENDIZAGEM \d+$/.test(s)) return true;
  if (/^UNIASSELVI$/.test(s)) return true;
  return false;
}

function cleanPage(t){
  return t.split('\n').filter(l => !isNoiseLine(l)).join('\n')
    .replace(/(E M F O C O|UNIASSELVI)/g,'').trim();
}

function parseQuestionBlock(num, text){
  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  const stem=[], afirm=[], cmd=[], alts=[];
  let mode='stem';
  for (const l of lines){
    const ma = l.match(ALT_RE);
    const mr = l.match(ROMAN_RE);
    if (ma && (mode!=='stem' || alts.length===0) && (mode==='alt' || mode==='cmd' || mode==='stem' || mode==='afirm')) {
      if (ma[1]==='a' || mode==='alt') { mode='alt'; alts.push({l:ma[1], lines:[l.slice(ma[0].length)]}); continue; }
    }
    if (mr && mode!=='alt'){ mode='afirm'; afirm.push({n:mr[1], lines:[l.slice(mr[0].length)]}); continue; }
    if (mode==='stem') stem.push(l);
    else if (mode==='afirm'){
      if (/^(É correto|Assinale|Agora,? assinale|A sequência|Está correto|Estão corretas)/i.test(l)) { mode='cmd'; cmd.push(l); }
      else afirm[afirm.length-1].lines.push(l);
    }
    else if (mode==='cmd') cmd.push(l);
    else if (mode==='alt') alts[alts.length-1].lines.push(l);
  }
  // separa o comando final (a frase que pede a resposta) do contexto
  let enunciado = joinLines(stem);
  let comando = '';
  const CMD = /((?:Com base|Sobre|Analise|Assinale|Considerando|Diante|A partir|De acordo|Nesse contexto|Em relação|Qual|Quais|Marque|Identifique)[^:?]*[:?])\s*$/;
  let m = enunciado.match(CMD);
  if (!m){ const i = enunciado.lastIndexOf('. ', enunciado.length - 2); if (i > 0 && /[:?]$/.test(enunciado)) { const t = enunciado.slice(i+2); m = [t, t]; } }
  if (m && m[1].length < enunciado.length){ comando = m[1].trim(); enunciado = enunciado.slice(0, enunciado.length - m[0].length).trim(); }
  const comandoFinal = afirm.length ? (joinLines(cmd) || 'É correto o que se afirma em:') : comando;
  const enunciadoFinal = afirm.length && comando ? enunciado + '\n' + comando : enunciado;
  return {
    id: 'livro-' + num, origem:'livro', numero:num,
    enunciado: enunciadoFinal,
    afirmativas: afirm.map(a => ({n:a.n, t:joinLines(a.lines)})),
    comando: comandoFinal,
    alternativas: alts.map(a => ({l:a.l, t:joinLines(a.lines)}))
  };
}

function parseQuestions(text){
  const t = text.replace(/AUTOATIVIDADE/g,'\n');
  const lines = t.split('\n').filter(l => !isNoiseLine(l));
  const blocks=[]; let cur=null;
  for (const l of lines){
    const m = l.trim().match(/^(\d{1,2})\.\s+(.*)$/);
    if (m && (!cur || +m[1] === cur.num + 1)) { cur = {num:+m[1], lines:[m[2]]}; blocks.push(cur); continue; }
    if (cur) cur.lines.push(l);
  }
  return blocks.map(b => parseQuestionBlock(b.num, b.lines.join('\n'))).filter(q => q.alternativas.length >= 2);
}

function buildStructure(pages, nomeArquivo){
  const n = pages.length;
  const C = pages.map(compact);
  const temaStarts = [];
  const unidadePages = [];
  for (let i=0;i<n;i++){
    if (/^UNIDADE\d+$/.test(C[i])) unidadePages.push({p:i+1, n:+C[i].match(/\d+/)[0]});
    if (C[i].startsWith('MINHASMETAS')) {
      temaStarts.push({p:i+1, n: temaStarts.length+1});
    }
  }
  const temas = [];
  if (temaStarts.length){
    temaStarts.forEach((ts, k) => {
      const next = k+1 < temaStarts.length ? temaStarts[k+1].p : n+1;
      // fim: última página antes de REFERÊNCIAS
      let fim = next - 1, ref = null;
      for (let p = ts.p; p < next; p++) if (C[p-1].startsWith('REFERÊNCIAS') || C[p-1].startsWith('REFERENCIAS')) { ref = p; break; }
      if (ref) fim = ref - 1;
      // abre: título e metas
      const first = pages[ts.p-1].replace(/^MINHAS METAS/, '');
      const ls = first.split('\n').map(s=>s.trim()).filter(Boolean);
      const tl=[], metas=[];
      for (const l of ls){
        if (isNoiseLine(l) || /^T\s?E\s?M\s?A/.test(l)) continue;
        if (!metas.length && /^[^a-zà-ú]+$/.test(l)) tl.push(l); else metas.push(l);
      }
      // autoatividades
      const qPages = [];
      for (let p = ts.p; p <= fim; p++) if (C[p-1].includes('AUTOATIVIDADE')) qPages.push(p);
      let questoes = [];
      if (qPages.length){
        questoes = parseQuestions(qPages.map(p => pages[p-1]).join('\n'));
      }
      // gabarito do livro (fica depois das referências)
      let gabarito = {};
      const gPages = [];
      for (let p = ts.p; p < next; p++) if (C[p-1].includes('GABARITO') && /^\s*1\.\s*Alternativa/i.test(pages[p-1])) { gPages.push(p); if (p + 1 < next && /^\s*\d\.\s*Alternativa/i.test(pages[p]) ) gPages.push(p+1); }
      if (gPages.length) gabarito = parseGabarito([...new Set(gPages)].map(p => pages[p-1]).join('\n'));
      const unidade = (unidadePages.filter(u => u.p < ts.p).pop() || {n:1}).n;
      const conteudoFim = qPages.length ? Math.min(...qPages) - 1 : fim;
      temas.push({
        n: ts.n, unidade,
        titulo: tituloBonito(joinLines(tl)) || ('Tema ' + ts.n),
        metas,
        pIni: ts.p, pFim: conteudoFim, pQuestoes: qPages,
        questoes, gabarito
      });
    });
  } else {
    // material genérico: partes de até 15 páginas
    const tam = 15;
    for (let i=0, k=1; i<n; i+=tam, k++){
      temas.push({ n:k, unidade:1, titulo:'Páginas ' + (i+1) + ' a ' + Math.min(n, i+tam), metas:[], pIni:i+1, pFim:Math.min(n,i+tam), pQuestoes:[], questoes:[] });
    }
  }
  return {
    nome: nomeArquivo || 'Material',
    totalPaginas: n,
    formatoLivro: temaStarts.length > 0,
    unidades: [...new Set(temas.map(t=>t.unidade))],
    temas
  };
}

function tituloBonito(s){
  if (!s) return s;
  const keep = new Set(['HTML5','CSS3','DOM','HTML','CSS','API','HTTP','URL','UX','UI','SEO','W3C','JSON']);
  const minus = new Set(['de','da','do','das','dos','e','com','em','ao','a','o','para']);
  return s.split(/\s+/).map((w,i) => {
    const bare = w.replace(/[()]/g,'');
    if (keep.has(bare)) return w;
    if (bare === 'JAVASCRIPT') return w.replace('JAVASCRIPT', 'JavaScript');
    const lw = w.toLowerCase();
    if (i>0 && minus.has(lw)) return lw;
    return lw.replace(/(^|[(\-])([a-zà-ú])/g, (m,a,b)=>a+b.toUpperCase());
  }).join(' ');
}

function textoTema(pages, tema, maxChars){
  let out = '';
  for (let p = tema.pIni; p <= tema.pFim; p++){
    const lines = cleanPage(pages[p-1]).split('\n');
    out += '\n[pág ' + p + ']\n' + joinParas(lines);
    if (maxChars && out.length > maxChars) break;
  }
  return out.slice(0, maxChars || out.length);
}
function joinParas(lines){
  // junta linhas quebradas, mantendo quebras quando a linha anterior termina frase
  const paras=[]; let cur=[];
  for (const l of lines){
    cur.push(l);
    if (/[.:!?]$/.test(l.trim())) { paras.push(joinLines(cur)); cur=[]; }
  }
  if (cur.length) paras.push(joinLines(cur));
  return paras.join('\n');
}

function termos(s){
  const tags = (s.match(/<[a-z0-9!]+/gi) || []).map(x=>x.toLowerCase());
  const words = s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z0-9][a-z0-9-]{4,}/g) || [];
  return [...new Set([...tags, ...words.filter(w => !STOP.has(w))])];
}
function paginasProvaveis(pages, tema, q){
  const txt = [q.enunciado, ...(q.afirmativas||[]).map(a=>a.t), ...(q.alternativas||[]).map(a=>a.t)].join(' ');
  const ts = termos(txt);
  const scores=[];
  for (let p = tema.pIni + 1; p <= tema.pFim; p++){
    const pt = pages[p-1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    let s = 0;
    for (const t of ts){ const c = pt.split(t).length - 1; if (c) s += 1 + Math.log(c); }
    scores.push({p, s});
  }
  return scores.sort((a,b)=>b.s-a.s).slice(0,3).filter(x=>x.s>0).map(x=>x.p).sort((a,b)=>a-b);
}



function parseGabarito(text){
  const t = text.replace(/GABARITO/g, '\n');
  const lines = t.split('\n').filter(l => !isNoiseLine(l));
  const joined = joinLines(lines);
  const out = {};
  const re = /(?:^|\s)(\d{1,2})\.\s*Alternativa\s+([A-Ea-e])\b\.?/g;
  const marks = []; let m;
  while ((m = re.exec(joined))) marks.push({ num:+m[1], letra:m[2].toLowerCase(), ini:m.index, fimCab:re.lastIndex });
  marks.forEach((mk, i) => {
    const corpo = joined.slice(mk.fimCab, i + 1 < marks.length ? marks[i+1].ini : joined.length).trim();
    const partes = corpo.split(/(?=A (?:alternativa|afirmativa) [A-Ea-e]\b|A (?:alternativa|afirmativa) (?:I|II|III|IV|V)\b)/);
    let explicacao = '';
    const erradas = {}, afirmativas = {};
    for (const p of partes){
      const ma = p.match(/^A (?:alternativa|afirmativa) ([A-Ea-e]) está (?:incorreta|errada)[,.]?\s*(?:pois|porque)?\s*([\s\S]*)$/);
      const mf = p.match(/^A afirmativa (I|II|III|IV|V) está (correta|incorreta)[,.]?\s*(?:pois|porque)?\s*([\s\S]*)$/);
      if (ma){ erradas[ma[1].toLowerCase()] = cap1(ma[2].trim().replace(/^[,;:\s]+/, '')); }
      else if (mf){ afirmativas[mf[1]] = (mf[2] === 'correta' ? 'Verdadeira: ' : 'Falsa: ') + mf[3].trim(); }
      else explicacao += (explicacao ? ' ' : '') + p.trim();
    }
    out[mk.num] = { correta: mk.letra, explicacao, erradas, afirmativas, paginas: [], conceito: '', fonte: 'livro' };
  });
  return out;
}
function cap1(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
if (typeof module !== 'undefined') module.exports.parseGabarito = parseGabarito;

function reconhecerLivro(m){

}

const pistasDe = n => (S.emb && S.emb[n] && S.emb[n].pistas) || (S.analise[n] && S.analise[n].pistas) || [];
const embTreinoCache = {};
function embTreino(n){
  if (!S.emb || !S.emb[n]) return [];

  const t = tema(n);
  embTreinoCache[n] = (S.emb[n].treino || []).map((x, i) => {

/* ---------- armazenamento (IndexedDB com reserva em memória) ---------- */
const idb = (() => {
  let dbp = null; const mem = new Map();
  function open(){
    if (dbp) return dbp;
    dbp = new Promise(res => {
      try {
        const r = indexedDB.open('marca-texto', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function get(k){
    const db = await open(); if (!db) return mem.get(k);
    return new Promise(res => {
      try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? mem.get(k)); q.onerror = () => res(mem.get(k)); }
      catch (e) { res(mem.get(k)); }
    });
  }
  async function set(k, v){
    mem.set(k, v); const db = await open(); if (!db) return;
    return new Promise(res => {
      try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); }
      catch (e) { res(); }
    });
  }
  async function clear(){
    mem.clear(); const db = await open(); if (!db) return;
    return new Promise(res => {
      try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = () => res(); tx.onerror = () => res(); }
      catch (e) { res(); }
    });
  }
  return { get, set, clear };
})();

/* ---------- sincronização entre aparelhos (GitHub Gist da própria conta) ---------- */
const SYNC_ARQ = 'marca-texto-progresso.json';
const SY = { token:'', gist:'', status:'', erro:'', ultima:'', ocupado:false, pendente:false, t:null };
try { SY.token = localStorage.getItem('mt-token') || ''; SY.gist = localStorage.getItem('mt-gist') || ''; SY.ultima = localStorage.getItem('mt-ultima') || ''; } catch (e) {}
function lsSet(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

function mesclarProg(a, b){
  a = a || {}; b = b || {};
  const out = { temas:{}, simulados:{}, usadas:[] };
  const ta = a.temas || {}, tb = b.temas || {};
  for (const n of new Set([...Object.keys(ta), ...Object.keys(tb)])){
    const x = ta[n] || {}, y = tb[n] || {};
    const ra = x.respostas || {}, rb = y.respostas || {}, resp = {};
    for (const q of new Set([...Object.keys(ra), ...Object.keys(rb)])){
      const u = ra[q], v = rb[q];
      resp[q] = !u ? v : !v ? u : (u.fim && !v.fim) ? u : (v.fim && !u.fim) ? v : ((u.tentativas || []).length >= (v.tentativas || []).length ? u : v);
    }
    out.temas[n] = Object.assign({}, y, x, {
      leuPerguntas: !!(x.leuPerguntas || y.leuPerguntas),
      leuTema: !!(x.leuTema || y.leuTema),
      achadas: [...new Set([...(x.achadas || []), ...(y.achadas || [])])],
      treinoFeito: Math.max(x.treinoFeito || 0, y.treinoFeito || 0),
      respostas: resp
    });
    const m = Math.max(x.mostrar || 0, y.mostrar || 0); if (m) out.temas[n].mostrar = m;
  }
  const sa = a.simulados || {}, sb = b.simulados || {};
  for (const k of new Set([...Object.keys(sa), ...Object.keys(sb)])){
    const u = sa[k], v = sb[k];
    out.simulados[k] = !u ? v : !v ? u : ((u.quando || u.data || '') >= (v.quando || v.data || '') ? u : v);
  }
  out.usadas = [...new Set([...(a.usadas || []), ...(b.usadas || [])])];
  return out;
}
function mesclarConfig(a, b){
  if (!b) return a; if (!a) return b;
  const base = (b.atualizado || 0) > (a.atualizado || 0) ? b : a;
  const inis = [a.inicio, b.inicio].filter(Boolean).sort();
  return Object.assign({}, base, { inicio: inis[0] || base.inicio });
}

async function gh(caminho, opcoes){
  const r = await fetch('https://api.github.com' + caminho, Object.assign({ cache:'no-store' }, opcoes, {
    headers: Object.assign({ 'Authorization':'Bearer ' + SY.token, 'Accept':'application/vnd.github+json' }, (opcoes && opcoes.body) ? { 'Content-Type':'application/json' } : {})
  }));
  if (r.status === 401) throw { tipo:'token' };
  if (r.status === 404) throw { tipo:'404' };
  if (!r.ok) throw { tipo:'http', status:r.status };
  return r.json();
}
async function acharGist(){
  if (SY.gist) return SY.gist;
  for (let pag = 1; pag <= 5; pag++){
    const lista = await gh('/gists?per_page=100&page=' + pag);
    const g = lista.find(x => x.files && x.files[SYNC_ARQ]);
    if (g){ SY.gist = g.id; lsSet('mt-gist', g.id); return g.id; }
    if (lista.length < 100) break;
  }
  const novo = await gh('/gists', { method:'POST', body: JSON.stringify({ description:'Progresso do Marca-texto', public:false, files:{ [SYNC_ARQ]:{ content: JSON.stringify({ v:1, prog:S.prog, config:S.config }) } } }) });
  SY.gist = novo.id; lsSet('mt-gist', novo.id); return novo.id;
}
async function sincronizar(){
  if (!SY.token || !S.prog) return;
  if (SY.ocupado){ SY.pendente = true; return; }
  SY.ocupado = true; SY.erro = ''; SY.status = 'Sincronizando…'; atualizarSyncUI();
  try {
    let id = await acharGist(), g;
    try { g = await gh('/gists/' + id); }
    catch (e){ if (e.tipo === '404'){ SY.gist = ''; lsSet('mt-gist', ''); id = await acharGist(); g = await gh('/gists/' + id); } else throw e; }
    const f = g.files && g.files[SYNC_ARQ];
    let remoto = {};
    if (f){
      let txt = f.content;
      if (f.truncated && f.raw_url){ const rr = await fetch(f.raw_url, { cache:'no-store' }); txt = await rr.text(); }
      try { remoto = JSON.parse(txt || '{}'); } catch (e) { remoto = {}; }
    }
    const prog = mesclarProg(S.prog, remoto.prog);
    const config = mesclarConfig(S.config, remoto.config);
    const local = JSON.stringify({ p:S.prog, c:S.config });
    const novo = JSON.stringify({ p:prog, c:config });
    if (novo !== local){
      S.prog = prog; S.config = config;
      await idb.set('progresso', S.prog); await idb.set('config', S.config);
      render();
    }
    if (novo !== JSON.stringify({ p:remoto.prog, c:remoto.config })){
      await gh('/gists/' + id, { method:'PATCH', body: JSON.stringify({ files:{ [SYNC_ARQ]:{ content: JSON.stringify({ v:1, prog, config }) } } }) });
    }
    SY.ultima = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) + ' de ' + fmtCurto(new Date());
    lsSet('mt-ultima', SY.ultima); SY.status = '';
  } catch (e){
    SY.status = '';
    SY.erro = e && e.tipo === 'token' ? 'O token não funcionou ou expirou. Crie um novo no GitHub e conecte de novo.'
      : (navigator.onLine === false || (e && e.name === 'TypeError')) ? 'Sem internet agora. O progresso sincroniza quando a conexão voltar.'
      : 'Não consegui sincronizar agora. Tente de novo em alguns minutos.';
  } finally {
    SY.ocupado = false; atualizarSyncUI();
    if (SY.pendente){ SY.pendente = false; agendarSync(1500); }
  }
}
function agendarSync(ms){ if (!SY.token) return; clearTimeout(SY.t); SY.t = setTimeout(sincronizar, ms == null ? 4000 : ms); }
function atualizarSyncUI(){ const el = document.getElementById('sync-box'); if (el) el.innerHTML = syncCorpo(); const ind = document.getElementById('sync-ind'); if (ind) ind.outerHTML = syncIndicador(); }
function syncIndicador(){
  if (!SY.token) return '<span id="sync-ind"></span>';
  const txt = SY.status ? 'Sincronizando' : SY.erro ? 'Sem sincronizar' : 'Sincronizado';
  return '<a id="sync-ind" class="sync-ind' + (SY.erro ? ' erro' : '') + '" href="#ajustes">' + txt + '</a>';
}
function syncCorpo(){
  if (SY.token){
    let h = '<p>' + (SY.status ? esc(SY.status) : SY.ultima ? 'Conectado. Última sincronização: ' + esc(SY.ultima) + '.' : 'Conectado.') + '</p>';
    if (SY.erro) h += '<p class="aviso erro" role="alert">' + esc(SY.erro) + '</p>';
    h += '<div class="linha"><button type="button" class="btn" data-act="sync-agora"' + (SY.ocupado ? ' disabled' : '') + '>Sincronizar agora</button><button type="button" class="btn-sec" data-act="sync-sair">Desconectar</button></div>';
    h += '<p class="nota">O progresso sincroniza sozinho ao abrir o app e depois de cada resposta. Em cada aparelho, envie o PDF uma vez: o progresso vem junto.</p>';
    return h;
  }
  let h = '<p>O progresso fica salvo em cada aparelho. Para o celular e o PC ficarem iguais, conecte a sua conta do GitHub (a mesma do site). Faça isso uma vez em cada aparelho.</p>';
  h += '<ol class="passos"><li><a href="https://github.com/settings/tokens/new?scopes=gist&description=Marca-texto" target="_blank" rel="noopener">Criar o token no GitHub</a>. A permissão <strong>gist</strong> já vem marcada.</li><li>Em <strong>Expiration</strong>, escolha <strong>No expiration</strong>. Toque em <strong>Generate token</strong> e copie o código.</li><li>Cole aqui e toque em Conectar. No outro aparelho, cole o mesmo código.</li></ol>';
  if (SY.erro) h += '<p class="aviso erro" role="alert">' + esc(SY.erro) + '</p>';
  h += '<label for="sync-token">Token do GitHub</label><input type="password" id="sync-token" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…"><button type="button" class="btn" data-act="sync-conectar">Conectar</button>';
  h += '<p class="nota">O token fica salvo só neste aparelho e só dá acesso aos seus gists. Não envie esse código para ninguém, nem em conversas.</p>';
  return h;
}


/* ---------- datas ---------- */
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const hojeISO = () => iso(new Date());
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((parseD(iso(b)) - parseD(iso(a))) / 86400000);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLongo = d => cap(d.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' }));
const mesCurto = d => d.toLocaleDateString('pt-BR', { month:'short' }).replace('.', '');
const fmtCurto = d => d.getDate() + ' ' + mesCurto(d);
const fmtFaixa = (a, b) => iso(a) === iso(b) ? fmtCurto(a) : (a.getMonth() === b.getMonth() ? a.getDate() + ' e ' + b.getDate() + ' ' + mesCurto(b) : fmtCurto(a) + ' a ' + fmtCurto(b));

/* ---------- utilidades de domínio ---------- */
const tema = n => S.material.temas.find(t => t.n === n);
function pt(n){
  S.prog.temas[n] = S.prog.temas[n] || { leuPerguntas:false, leuTema:false, achadas:[], respostas:{}, treinoFeito:0 };
  return S.prog.temas[n];
}
function concluido(t){
  const p = pt(t.n);
  return t.questoes.length ? t.questoes.every(q => p.respostas[q.id]?.fim) : p.leuTema;
}
function etapas(t){
  const p = pt(t.n), temQ = t.questoes.length > 0;
  const lista = [];
  if (temQ) lista.push({ id:'perguntas', nome:'Leia as perguntas antes', feito:p.leuPerguntas });
  lista.push({ id:'leitura', nome:'Leia o livro procurando isto', feito:p.leuTema });
  if (temQ) lista.push({ id:'responder', nome:'Responda sem consultar', feito:concluido(t) });
  lista.push({ id:'treino', nome:'Treine no estilo da prova', feito:(p.treinoFeito||0) > 0 });
  return lista;
}
const acertosPrimeira = t => t.questoes.filter(q => pt(t.n).respostas[q.id]?.primeira).length;
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fita = ps => { ps = (ps || []).filter(Boolean); if (!ps.length) return ''; return '<span class="fita">p. ' + ps.map(esc).join(' e ') + '</span>'; };

function plano(){
  const temas = S.material.temas, T = temas.length;
  const ini = parseD(S.config.inicio);
  const fimEstudo = addDays(parseD(S.config.dataProva), -2);
  let D = diffDays(ini, fimEstudo) + 1; if (D < 1) D = 1;
  return temas.map((t, k) => {
    const a = Math.floor(k * D / T), b = Math.max(a, Math.floor((k + 1) * D / T) - 1);
    return { n:t.n, ini:addDays(ini, a), fim:addDays(ini, b) };
  });
}

function avaliacoes(){
  const m = S.material, l = [];
  const doU = u => m.temas.filter(t => t.unidade === u).map(t => t.n);
  if (m.formatoLivro && doU(1).length) l.push({ id:'av1', nome:'Avaliação 1', desc:'Unidade 1', temas:doU(1), sim:true });
  if (m.formatoLivro && doU(2).length) l.push({ id:'av2', nome:'Avaliação 2', desc:'Unidade 2', temas:doU(2), sim:true });
  if (m.formatoLivro) l.push({ id:'av3', nome:'Avaliação 3', desc:'Trabalho com o template padrão da Uniasselvi', temas:[], sim:false });
  l.push({ id:'av4', nome: m.formatoLivro ? 'Avaliação 4' : 'Simulado geral', desc:'Prova final com 10 questões de todas as unidades', temas:m.temas.map(t => t.n), sim:true });
  return l;
}
function intervaloTemas(ns){
  if (!ns.length) return '';
  return ns.length === 1 ? 'Tema ' + ns[0] : 'Temas ' + ns[0] + ' a ' + ns[ns.length - 1];
}
function caiEm(t){
  if (!S.material.formatoLivro) return '';
  if (t.unidade === 1) return 'Cai na Avaliação 1 e na Avaliação 4.';
  if (t.unidade === 2) return 'Cai na Avaliação 2 e na Avaliação 4.';
  return 'Cai na Avaliação 4.';
}

const DESLIGA = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function msgErro(e){
  const c = e && e.code;
  if (c === 'sem_ia' || DESLIGA.includes(c)) return 'O Claude não está liberado nesta página. Abra o Marca-texto pelo link do Claude, com sua conta conectada.';
  if (c === 'rate_limited') return 'Muitos pedidos seguidos ao Claude. Espere alguns minutos e tente de novo.';
  if (c === 'session_expired') return 'Sua sessão do Claude expirou. Entre de novo na sua conta e tente outra vez.';
  if (c === 'prompt_too_large') return 'Este tema é grande demais para analisar de uma vez.';
  if (c === 'refused') return 'O Claude não conseguiu analisar este trecho. Tente de novo mais tarde.';
  return 'A resposta do Claude veio incompleta. Tente de novo.';
}
function tratarErroIA(e){ if (e && DESLIGA.includes(e.code)) S.ia = null; }

function questaoTexto(q){
  let s = q.numero + '. ' + q.enunciado + '\n';
  q.afirmativas.forEach(a => { s += a.n + ' - ' + a.t + '\n'; });
  if (q.comando) s += q.comando + '\n';
  q.alternativas.forEach(a => { s += a.l + ') ' + a.t + '\n'; });
  return s;
}
function clampPag(p, t){ p = parseInt(p, 10); if (!p || p < t.pIni || p > t.pFim) return null; return p; }

function promptAnalise(t, texto){

function normAnalise(r, t){
  const pistas = (Array.isArray(r && r.pistas) ? r.pistas : []).map(x => ({
    conceito: String(x.conceito || '').trim(), pagina: clampPag(x.pagina, t),
    pergunta: String(x.pergunta || '').trim(), resposta: String(x.resposta || '').trim(),
    pegadinha: String(x.pegadinha || '').trim()
  })).filter(x => x.conceito && x.pergunta);
  pistas.sort((a, b) => (a.pagina || 9999) - (b.pagina || 9999));
  const gabarito = {};
  for (const g of (Array.isArray(r && r.gabarito) ? r.gabarito : [])){
    const num = parseInt(g.numero, 10);
    const c = String(g.correta || '').trim().toLowerCase().charAt(0);
    if (!num || !c || !'abcde'.includes(c)) continue;
    const pags = Array.isArray(g.paginas) ? g.paginas : [g.paginas];
    gabarito[num] = {
      correta: c, explicacao: String(g.explicacao || ''),
      paginas: [...new Set(pags.map(p => clampPag(p, t)).filter(Boolean))],
      conceito: String(g.conceito || ''),
      erradas: (g.erradas && typeof g.erradas === 'object') ? g.erradas : {},
      afirmativas: (g.afirmativas && typeof g.afirmativas === 'object') ? g.afirmativas : {}
    };
  }
  if (!pistas.length && !Object.keys(gabarito).length) throw { code:'invalid_json' };
  return { pistas, gabarito };
}

function normTreino(arr, t){
  if (!Array.isArray(arr)) arr = arr && arr.questoes;
  if (!Array.isArray(arr)) throw { code:'invalid_json' };
  const stamp = Date.now().toString(36);
  const out = arr.map((x, i) => {
    const alts = (x && x.alternativas) || {};
    const letras = ['a','b','c','d','e'].filter(l => typeof alts[l] === 'string' && alts[l].trim());
    const correta = String(x.correta || '').trim().toLowerCase().charAt(0);
    if (letras.length < 4 || !letras.includes(correta)) return null;
    const af = Array.isArray(x.afirmativas) ? x.afirmativas.filter(s => typeof s === 'string' && s.trim()) : [];
    const pag = clampPag(x.pagina, t);
    return {
      id: 'ia-' + stamp + '-' + i, origem:'ia', tema:t.n,
      enunciado: String(x.contexto || '').trim(),
      afirmativas: af.map((s, j) => ({ n:ROM[j], t:s.replace(/^\s*(I|II|III|IV|V|VI)\s*[-–—.)]\s*/, '').trim() })),
      comando: String(x.comando || (af.length ? 'É correto o que se afirma em:' : 'Assinale a alternativa correta:')).trim(),
      alternativas: letras.map(l => ({ l, t:alts[l].trim().replace(/^[a-e]\)\s*/, '') })),
      gab: { correta, explicacao:String(x.explicacao || ''), paginas: pag ? [pag] : [], conceito:String(x.conceito || ''), erradas:{}, afirmativas:{} }
    };
  }).filter(Boolean);
  if (!out.length) throw { code:'invalid_json' };
  return out;
}

async function analisarTema(n){
  if (S.analise[n]) return S.analise[n];
  if (!S.ia) throw { code:'sem_ia' };
  const t = tema(n);
  const ctl = new AbortController(); S.busy['a' + n] = ctl; render();
  try {
    const r = await S.ia.json(promptAnalise(t, textoTema(S.material.pages, t, 70000)), { signal:ctl.signal, modelTier:'default' });
    const a = normAnalise(r, t);
    S.analise[n] = a; await idb.set('ia:analise:' + n, a);
    return a;
  } catch (e) { tratarErroIA(e); throw e; }
  finally { delete S.busy['a' + n]; render(); }
}

async function gerarTreino(n, k, signal){
  if (!S.ia) throw { code:'sem_ia' };
  const t = tema(n), atual = S.treino[n] || [];
  const evitar = [...atual.map(q => q.gab.conceito), ...t.questoes.map(q => (S.analise[n] && S.analise[n].gabarito[q.numero] || {}).conceito)].filter(Boolean).slice(-20);
  try {
    const r = await S.ia.json(promptTreino(t, textoTema(S.material.pages, t, 70000), k, evitar), { signal, modelTier:'default', cache:false });
    const qs = normTreino(r, t);
    S.treino[n] = atual.concat(qs); await idb.set('ia:treino:' + n, S.treino[n]);
    return qs;
  } catch (e) { tratarErroIA(e); throw e; }
}

function gabDe(q, n){
  if (q.origem === 'ia') return q.gab;
  const t = tema(n);
  const doLivro = t.gabarito && t.gabarito[q.numero];
  if (doLivro){
    const ref = (S.emb && S.emb[n] && S.emb[n].livro && S.emb[n].livro[q.numero]) || {};
    const ia = S.analise[n] && S.analise[n].gabarito[q.numero];
    return Object.assign({}, doLivro, {
      paginas: ref.paginas || (ia && ia.paginas && ia.paginas.length ? ia.paginas : paginasProvaveis(S.material.pages, t, q).slice(0, 2)),
      conceito: ref.conceito || (ia && ia.conceito) || '',
      explicacao: ref.explicacao || doLivro.explicacao || (ia && ia.explicacao) || ''
    });
  }
  const a = S.analise[n]; return a ? (a.gabarito[q.numero] || null) : null;
}

/* ---------- ações ---------- */
function achar(key){
  const [ns, ...rest] = key.split('|'); const n = +ns, id = rest.join('|');
  const t = tema(n);
  const q = t.questoes.find(x => x.id === id) || treinoDe(n).find(x => x.id === id);
  return { n, q };
}

async function conferir(key){
  const { n, q } = achar(key); const sel = S.sel[key];
  if (!q || !sel) return;
  delete S.erros[key];
  let g = gabDe(q, n);
  if (!g){
    if (!S.ia){ S.erros[key] = msgErro({ code:'sem_ia' }); render(); return; }
    S.busy[key] = true; render();
    try { await analisarTema(n); }
    catch (e){ delete S.busy[key]; if (e.code !== 'cancelled') S.erros[key] = msgErro(e); render(); return; }
    delete S.busy[key];
    g = gabDe(q, n);
    if (!g){ S.erros[key] = 'Não encontrei o gabarito desta questão. Toque em Conferir de novo.'; delete S.analise[n]; render(); return; }
  }
  const p = pt(n);
  const r = p.respostas[q.id] = p.respostas[q.id] || { tentativas:[], fim:false, primeira:false };
  if (r.fim) return;
  r.tentativas.push(sel); delete S.sel[key];
  if (sel === g.correta){ r.fim = true; r.primeira = r.tentativas.length === 1; }
  else if (r.tentativas.length >= 2) r.fim = true;
  if (r.fim && q.origem === 'ia') p.treinoFeito = (p.treinoFeito || 0) + 1;
  salvarProg(); render();
}

function marcarEtapa(n, id){
  const p = pt(n);
  if (id === 'perguntas') p.leuPerguntas = true;
  if (id === 'leitura') p.leuTema = true;
  salvarProg();
  const lista = etapas(tema(n));
  const i = lista.findIndex(e => e.id === id);
  S.abertos[n + ':' + id] = false;
  if (lista[i + 1]) S.abertos[n + ':' + lista[i + 1].id] = true;
  render();

}

async function pedirPistas(n){
  delete S.erros['pistas' + n];

async function pedirTreino(n){

/* simulado */
function novasDo(n){
  const usadas = new Set(S.prog.usadas || []), p = pt(n);
  return treinoDe(n).filter(q => !usadas.has(q.id) && !p.respostas[q.id]);
}
function livroDo(n){ return tema(n).questoes.filter(q => gabDe(q, n)); }

async function iniciarSimulado(id){
  const av = avaliacoes().find(a => a.id === id); if (!av) return;
  const alvo = 10, porTema = Math.max(1, Math.ceil(alvo / av.temas.length));
  const precisa = av.temas.filter(n => novasDo(n).length < porTema);
  location.hash = '#simulado';
  if (precisa.length && S.ia){
    const ctl = new AbortController();
    S.sim = { id, fase:'preparando', passo:0, total:precisa.length, ctl, msg:'' };
    for (const n of precisa){
      if (ctl.signal.aborted) break;
      S.sim.passo++; S.sim.msg = 'Preparando questões do Tema ' + n + ' (' + S.sim.passo + ' de ' + S.sim.total + ')'; render();
      try { await gerarTreino(n, Math.max(2, porTema - novasDo(n).length + 1), ctl.signal); }
      catch (e){
        if (e.code === 'cancelled') break;
        S.sim = { id, fase:'erro', msg:msgErro(e) }; render(); return;
      }
    }
    if (ctl.signal.aborted){ S.sim = null; location.hash = '#simulados'; render(); return; }
  }
  let qs = [];
  for (const n of av.temas){
    const lista = [...shuffle(novasDo(n)), ...shuffle(livroDo(n)), ...shuffle(treinoDe(n))];
    const vistos = new Set();
    qs.push(...lista.filter(q => !vistos.has(q.id) && vistos.add(q.id)).slice(0, porTema).map(q => ({ q, n })));
  }
  qs = shuffle(qs).slice(0, alvo);
  if (qs.length < 3){
    S.sim = { id, fase:'erro', msg: S.ia ? 'Ainda não há questões suficientes. Tente de novo.' : 'Para montar o simulado, o Marca-texto precisa do Claude. Abra esta página pelo link do Claude, com sua conta conectada.' };
    render(); return;
  }
  S.sim = { id, fase:'prova', qs, resp:{}, i:0 };
  render(); window.scrollTo(0, 0);
}

function entregar(){
  const s = S.sim; let acertos = 0;
  s.qs.forEach((x, i) => { const g = gabDe(x.q, x.n); x.ok = !!(g && s.resp[i] === g.correta); if (x.ok) acertos++; });
  s.fase = 'resultado'; s.acertos = acertos;
  S.prog.simulados[s.id] = { acertos, total:s.qs.length, data:hojeISO(), quando:new Date().toISOString() };
  S.prog.usadas = [...new Set([...(S.prog.usadas || []), ...s.qs.filter(x => x.q.origem === 'ia').map(x => x.q.id)])];
  salvarProg(); render(); window.scrollTo(0, 0);
}

/* PDF */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function carregarScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); });
}
async function garantirPdfjs(){
  if (window.pdfjsLib) return window.pdfjsLib;
  await carregarScript(PDFJS + 'pdf.worker.min.js');
  await carregarScript(PDFJS + 'pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
function itemsToText(items){
  let out = '';
  for (const it of items){ if (it.str === undefined) continue; out += it.str; if (it.hasEOL) out += '\n'; }
  return out;
}
function progressoLeitura(){
  const b = $('#barra-leitura'), t = $('#txt-leitura');
  if (!b || !S.up) return;
  const pct = S.up.total ? Math.round(100 * S.up.atual / S.up.total) : 3;
  b.style.width = pct + '%';
  t.textContent = S.up.total ? 'Lendo a página ' + S.up.atual + ' de ' + S.up.total : 'Abrindo o PDF';
}
async function lerPdf(file){
  if (!file) return;
  S.up = { fase:'lendo', atual:0, total:0 }; render();
  try {
    const lib = await garantirPdfjs();
    const buf = await file.arrayBuffer();
    const doc = await lib.getDocument({ data:new Uint8Array(buf), isEvalSupported:false, disableFontFace:true }).promise;
    S.up.total = doc.numPages; progressoLeitura();
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++){
      const pg = await doc.getPage(i);
      const tc = await pg.getTextContent();
      pages.push(itemsToText(tc.items)); pg.cleanup();
      if (i % 3 === 0 || i === doc.numPages){ S.up.atual = i; progressoLeitura(); await new Promise(r => setTimeout(r, 0)); }
    }
    if (pages.join('').replace(/\s/g, '').length < 300) throw new Error('sem-texto');
    const est = buildStructure(pages, file.name);
    S.material = Object.assign({}, est, { pages });
    S.config = Object.assign({}, S.config, { inicio:hojeISO() });
    S.analise = {}; S.treino = {}; S.sel = {}; S.erros = {}; S.abertos = {}; S.sim = null;
    S.prog = { temas:{}, simulados:{}, usadas:[] };
    aplicarDados();
    await idb.clear();
    await idb.set('material', S.material); await idb.set('config', S.config); await idb.set('progresso', S.prog);
    S.up = null; location.hash = '#hoje'; render(); window.scrollTo(0, 0); agendarSync(300);
  } catch (e){
    const m = e && e.message;
    S.up = { fase:'erro', msg: m === 'sem-texto' ? 'Este PDF não tem texto selecionável (parece digitalizado como imagem). Use o PDF digital da matéria.'
      : m === 'script' ? 'Não consegui carregar o leitor de PDF. Confira sua internet e tente de novo.'
      : 'Não consegui ler este PDF. Confira se é o arquivo da matéria e tente de novo.' };
    render();
  }
}

function paragrafos(s){ return String(s || '').split('\n').filter(x => x.trim()).map(x => '<p>' + esc(x) + '</p>').join(''); }

function qCard(q, o){
  // o: {key, modo:'leitura'|'pratica'|'prova'|'revisao', rotulo, n, sel, estado, gab}
  const modo = o.modo;
  let h = '<article class="q q-' + modo + '" id="' + (modo === 'leitura' ? 'ql-' : 'q-') + esc(o.key || q.id) + '">';
  if (o.rotulo) h += '<p class="q-rot">' + esc(o.rotulo) + '</p>';
  h += '<div class="q-txt">' + paragrafos(q.enunciado) + '</div>';
  if (q.afirmativas.length){
    h += '<ol class="afirm">' + q.afirmativas.map(a => {
      let extra = '';
      if (o.gab && (o.estado && o.estado.fim || modo === 'revisao') && o.gab.afirmativas && o.gab.afirmativas[a.n]) extra = '<span class="afirm-vf">' + esc(o.gab.afirmativas[a.n]) + '</span>';
      return '<li><b>' + esc(a.n) + '</b><span>' + esc(a.t) + extra + '</span></li>';
    }).join('') + '</ol>';
  }
  if (q.comando) h += '<p class="q-cmd">' + esc(q.comando) + '</p>';

  const est = o.estado || { tentativas:[], fim:false };
  const g = o.gab;
  const mostrarGab = (modo === 'pratica' && est.fim && g) || (modo === 'revisao' && g);
  if (modo === 'leitura'){
    h += '<ul class="alts-lista">' + q.alternativas.map(a => '<li><b>' + a.l + ')</b> ' + esc(a.t) + '</li>').join('') + '</ul>';
  } else {
    h += '<div class="alts" role="radiogroup" aria-label="Alternativas">';
    for (const a of q.alternativas){
      let cls = 'alt', dis = false, marca = '';
      if (modo === 'pratica'){
        if (est.tentativas.includes(a.l) && (!g || a.l !== g.correta)){ cls += ' riscada'; dis = true; marca = '<span class="alt-tag">Sua resposta</span>'; }
        if (mostrarGab && a.l === g.correta){ cls += ' certa'; marca = '<span class="alt-tag">Correta</span>'; }
        if (est.fim) dis = true;
      }
      if (modo === 'revisao'){
        dis = true;
        if (g && a.l === g.correta){ cls += ' certa'; marca = '<span class="alt-tag">Correta</span>'; }
        else if (o.sel === a.l){ cls += ' riscada'; marca = '<span class="alt-tag">Sua resposta</span>'; }
      }
      const marcado = o.sel === a.l && modo !== 'revisao';
      if (marcado) cls += ' sel';
      const act = modo === 'prova' ? 'sim-escolher' : 'escolher';
      h += '<button type="button" role="radio" aria-checked="' + marcado + '" class="' + cls + '"' + (dis ? ' disabled' : '') +
        ' data-act="' + act + '" data-k="' + esc(o.key || '') + '" data-l="' + a.l + '"><span class="alt-l">' + a.l + '</span><span class="alt-t">' + esc(a.t) + marca + '</span></button>';
    }
    h += '</div>';
  }

  if (modo === 'pratica'){
    const k = o.key;
    if (S.erros[k]) h += '<p class="aviso erro" role="alert">' + esc(S.erros[k]) + '</p>';
    if (!est.fim && est.tentativas.length === 1 && g){
      h += '<div class="aviso dica" role="status"><p><strong>Ainda não.</strong> Releia ' + (g.paginas.length ? 'a ' + fita(g.paginas) : 'o trecho do livro') + (g.conceito ? ' sobre <strong>' + esc(g.conceito) + '</strong>' : '') + ' e tente de novo.</p></div>';
    }
    if (mostrarGab) h += explicacao(q, g, est);
    if (!est.fim){
      const busy = !!S.busy[k];
      h += '<div class="q-acoes"><button type="button" class="btn" data-act="conferir" data-k="' + esc(k) + '"' + ((!o.sel || busy) ? ' disabled' : '') + '>' + (busy ? 'Conferindo com o livro…' : 'Conferir') + '</button></div>';
    }
  }
  if (modo === 'revisao' && g) h += explicacao(q, g, { tentativas: o.sel ? [o.sel] : [], fim:true, revisao:true, sel:o.sel });
  h += '</article>';
  return h;
}

function explicacao(q, g, est){
  let titulo;
  if (est.revisao) titulo = est.sel === g.correta ? 'Você acertou.' : (est.sel ? 'A resposta certa é a letra ' + g.correta + '.' : 'Sem resposta. A certa é a letra ' + g.correta + '.');
  else if (est.primeira) titulo = 'Certa de primeira.';
  else if (est.tentativas[est.tentativas.length - 1] === g.correta) titulo = 'Certa na segunda tentativa.';
  else titulo = 'A resposta certa é a letra ' + g.correta + '.';
  const ok = est.revisao ? est.sel === g.correta : est.tentativas[est.tentativas.length - 1] === g.correta;
  let h = '<div class="explica ' + (ok ? 'ok' : 'nao') + '">';
  h += '<p class="explica-tit">' + esc(titulo) + ' ' + fita(g.paginas) + '</p>';
  if (g.explicacao) h += '<p>' + esc(g.explicacao) + '</p>';
  const erradas = (est.tentativas || []).filter(l => l !== g.correta && g.erradas && g.erradas[l]);
  for (const l of erradas) h += '<p class="explica-errada"><strong>Por que a ' + esc(l) + ' está errada:</strong> ' + esc(g.erradas[l]) + '</p>';
  h += '</div>';
  return h;
}

function viewHoje(){
  if (!S.material) return viewUpload();
  const prova = parseD(S.config.dataProva), hoje = parseD(hojeISO());
  const falta = diffDays(hoje, prova);
  const titulo = falta > 1 ? 'Faltam ' + falta + ' dias para a prova' : falta === 1 ? 'A prova é amanhã' : falta === 0 ? 'A prova é hoje' : 'A data da prova já passou';
  let h = '<section class="abre"><h1>' + titulo + '</h1><p class="abre-sub">' + esc(fmtLongo(prova)) + '. <a href="#ajustes">Mudar data</a>' + ' ' + syncIndicador() + '</p></section>';

  const pl = plano(), fimEstudo = addDays(prova, -2);
  h += '<section class="folha hoje">';
  if (falta < 0){
    h += '<h2 class="rot">Hoje</h2><p>Atualize a data da prova em <a href="#ajustes">Ajustes</a> para refazer o plano.</p>';
  } else if (hoje > fimEstudo){
    const final = avaliacoes().find(a => a.id === 'av4');
    h += '<h2 class="rot">Hoje</h2><p class="hoje-tit">Dia de revisão</p><p>Faça o simulado da ' + esc(final.nome) + ' e releia as páginas das questões que errar.</p><a class="btn" href="#simulados">Ir para os simulados</a>';
  } else {
    let alvo;
    if (hoje < pl[0].ini) alvo = tema(pl[0].n);
    else {
      const doDia = pl.filter(x => hoje >= x.ini && hoje <= x.fim).map(x => tema(x.n));
      alvo = doDia.find(t => !concluido(t)) || doDia[0] || tema(pl[pl.length - 1].n);
    }
    const ets = etapas(alvo), feitas = ets.filter(e => e.feito).length;
    h += '<h2 class="rot">Hoje, Tema ' + alvo.n + '</h2><p class="hoje-tit">' + esc(alvo.titulo) + '</p>';
    h += '<p class="hoje-meta">Páginas ' + alvo.pIni + ' a ' + alvo.pFim + ' ' + segmentos(alvo) + '</p>';
    h += '<a class="btn" href="#tema-' + alvo.n + '">' + (feitas === 0 ? 'Começar o tema' : feitas === ets.length ? 'Revisar o tema' : 'Continuar o tema') + '</a>';
  }
  h += '</section>';

  const atras = pl.filter(x => x.fim < hoje && !concluido(tema(x.n)));
  if (atras.length && falta >= 0){
    h += '<section class="atraso"><p><strong>Ficou para trás:</strong> ' + atras.map(x => '<a href="#tema-' + x.n + '">Tema ' + x.n + '</a>').join(', ') + '. Recupere quando der, sem pular a leitura.</p></section>';
  }

  h += '<section><h2 class="sec">Suas avaliações</h2><ul class="avs">';
  for (const av of avaliacoes()){
    const prontos = av.temas.filter(n => concluido(tema(n))).length;
    const r = S.prog.simulados[av.id];
    h += '<li class="av"><a href="#simulados"><span class="av-nome">' + esc(av.nome) + '</span><span class="av-desc">' + esc(av.desc) + (av.temas.length && av.id !== 'av4' ? ', ' + intervaloTemas(av.temas).toLowerCase() : '') + '</span>';
    if (av.sim) h += '<span class="av-st">' + prontos + ' de ' + av.temas.length + ' temas estudados' + (r ? '. Último simulado: ' + r.acertos + ' de ' + r.total : '') + '</span>';
    h += '</a></li>';
  }
  h += '</ul></section>';

  h += '<section><details class="plano"><summary>Ver o plano até a prova</summary><ul class="plano-l">';
  for (const x of pl){
    const t = tema(x.n), dt = fmtFaixa(x.ini, x.fim);
    h += '<li class="' + (concluido(t) ? 'feito' : '') + '"><span class="plano-d">' + esc(dt) + '</span><a href="#tema-' + t.n + '">Tema ' + t.n + ': ' + esc(t.titulo) + '</a>' + (concluido(t) ? '<span class="plano-ok" aria-label="concluído">' + ICON.check + '</span>' : '') + '</li>';
  }
  const rev1 = addDays(prova, -1);
  h += '<li><span class="plano-d">' + esc(fmtFaixa(rev1, prova)) + '</span><span>Revisão e simulado final</span></li>';
  h += '</ul></details></section>';
  return h;
}

function viewTemas(){
  if (!S.material) return viewUpload();
  let h = '<h1 class="tit-pag">Temas</h1>';
  if (!S.material.formatoLivro) h += '<p class="nota">Este material não segue o formato do livro da Uniasselvi, então foi dividido em partes de 15 páginas.</p>';
  for (const u of S.material.unidades){
    if (S.material.formatoLivro) h += '<h2 class="sec">Unidade ' + u + '</h2>';
    h += '<ul class="temas">';
    for (const t of S.material.temas.filter(x => x.unidade === u)){
      const ets = etapas(t), feitas = ets.filter(e => e.feito).length;
      let st = feitas === 0 ? 'Não começou' : concluido(t) ? (t.questoes.length ? 'Concluído. Acertou ' + acertosPrimeira(t) + ' de ' + t.questoes.length + ' de primeira' : 'Leitura concluída') : 'Etapa ' + Math.min(feitas + 1, ets.length) + ' de ' + ets.length;
      h += '<li><a href="#tema-' + t.n + '" class="tema-l' + (concluido(t) ? ' feito' : '') + '"><span class="tema-n">' + t.n + '</span><span class="tema-c"><span class="tema-t">' + esc(t.titulo) + '</span><span class="tema-m">Páginas ' + t.pIni + ' a ' + t.pFim + '</span><span class="tema-s">' + esc(st) + ' ' + segmentos(t) + '</span></span></a></li>';
    }
    h += '</ul>';
  }
  return h;
}

function viewTema(n){
  if (!S.material) return viewUpload();
  const t = tema(n); if (!t) return '<p>Tema não encontrado. <a href="#temas">Ver temas</a></p>';
  const p = pt(n), ets = etapas(t), atualI = ets.findIndex(e => !e.feito);
  let h = '<a class="voltar" href="#temas">' + ICON.voltar + 'Temas</a>';
  h += '<header class="tema-cab"><p class="tema-rot">Tema ' + t.n + (S.material.formatoLivro ? ', Unidade ' + t.unidade : '') + '</p><h1>' + esc(t.titulo) + '</h1>';
  h += '<p class="tema-info">Páginas ' + t.pIni + ' a ' + t.pFim + ' do livro. ' + esc(caiEm(t)) + '</p></header>';
  if (t.metas.length) h += '<details class="metas"><summary>O que o livro quer que você aprenda</summary><ul>' + t.metas.map(m => '<li>' + esc(m) + '</li>').join('') + '</ul></details>';

  h += '<ol class="etapas">';
  ets.forEach((e, i) => {
    const k = n + ':' + e.id;
    const aberto = S.abertos[k] !== undefined ? S.abertos[k] : i === atualI;
    h += '<li class="etapa' + (e.feito ? ' feita' : '') + '" id="et-' + e.id + '"><details data-et="' + k + '"' + (aberto ? ' open' : '') + '><summary><span class="etapa-n">' + (e.feito ? ICON.check : (i + 1)) + '</span><span class="etapa-nome">' + esc(e.nome) + '</span></summary><div class="etapa-corpo">';
    h += corpoEtapa(t, e, p) + '</div></details></li>';
  });
  h += '</ol>';
  return h;
}

function corpoEtapa(t, e, p){
  const n = t.n; let h = '';
  if (e.id === 'perguntas'){
    h += '<p>Estas são as autoatividades do fim do tema (páginas ' + t.pQuestoes.join(' e ') + '). Leia só para saber o que procurar. Não responda ainda.</p>';
    t.questoes.forEach(q => { h += qCard(q, { modo:'leitura', rotulo:'Pergunta ' + q.numero, key:n + '|' + q.id }); });
    if (!p.leuPerguntas) h += '<button type="button" class="btn" data-act="etapa" data-n="' + n + '" data-e="perguntas">Li as perguntas</button>';
  }
  if (e.id === 'leitura'){
    h += '<p>Abra o livro na <strong>página ' + t.pIni + '</strong> e leia até a <strong>página ' + t.pFim + '</strong>. Leia caçando a resposta destes pontos:</p>';
    const pistas = pistasDe(n);
    if (pistas.length){
      h += '<ul class="pistas">';
      pistas.forEach((x, i) => {
        const achou = (p.achadas || []).includes(i);
        h += '<li class="pista' + (achou ? ' achada' : '') + '"><div class="pista-cab"><span class="marca">' + esc(x.conceito) + '</span>' + fita(x.pagina ? [x.pagina] : []) + '</div><p class="pista-q">' + esc(x.pergunta) + '</p>';
        if (achou) h += '<div class="pista-r"><p><strong>No livro:</strong> ' + esc(x.resposta) + '</p>' + (x.pegadinha ? '<p class="pegadinha"><strong>Pegadinha:</strong> ' + esc(x.pegadinha) + '</p>' : '') + '</div>';
        else h += '<button type="button" class="btn-sec" data-act="achei" data-n="' + n + '" data-i="' + i + '">Achei no livro, conferir</button>';
        h += '</li>';
      });
      h += '</ul>';
    } else if (S.busy['a' + n]){
      h += '<div class="carregando" role="status"><span class="pulso" aria-hidden="true"></span><span>Lendo o tema com o Claude. Leva até um minuto.</span><button type="button" class="link" data-act="parar" data-b="a' + n + '">Parar</button></div>';
    } else if (S.ia){
      if (S.erros['pistas' + n]) h += '<p class="aviso erro" role="alert">' + esc(S.erros['pistas' + n]) + '</p>';
      h += '<button type="button" class="btn-sec" data-act="pistas" data-n="' + n + '">Mostrar o que procurar</button><p class="nota">O Claude lê o tema e marca os pontos que mais caem, com a página de cada um.</p>';
    } else if (!S.iaPronto){
      h += '<p class="nota">Conectando ao Claude…</p>';
    }
    if (!pistas.length && t.questoes.length){
      h += '<div class="provaveis"><p class="nota">Páginas que mais falam de cada pergunta:</p><ul>' + t.questoes.map(q => '<li>Pergunta ' + q.numero + ': ' + (paginasProvaveis(S.material.pages, t, q).map(pg => fita([pg])).join(' ') || 'leia o tema inteiro') + '</li>').join('') + '</ul></div>';
    }
    if (!p.leuTema) h += '<button type="button" class="btn" data-act="etapa" data-n="' + n + '" data-e="leitura">Terminei a leitura</button>';
  }
  if (e.id === 'responder'){
    h += '<p>Agora responda sem olhar o livro. Se errar, o Marca-texto mostra a página para reler antes da segunda tentativa.</p>';
    t.questoes.forEach(q => {
      const key = n + '|' + q.id;
      h += qCard(q, { modo:'pratica', rotulo:'Pergunta ' + q.numero, key, sel:S.sel[key], estado:p.respostas[q.id], gab:gabDe(q, n) });
    });
    if (concluido(t)) h += '<p class="resumo-acertos">Você acertou <strong>' + acertosPrimeira(t) + ' de ' + t.questoes.length + '</strong> de primeira.' + (acertosPrimeira(t) < t.questoes.length ? ' Releia as páginas indicadas nas que errou.' : '') + '</p>';
  }
  if (e.id === 'treino'){
    const todas = treinoDe(n);
    const visiveis = (S.treino[n] || []).length ? todas.length : Math.min(todas.length, p.mostrar || 3);
    const qs = todas.slice(0, visiveis);
    h += '<p>Questões novas no formato da prova: contexto, comando e alternativas com pegadinhas. Todas vêm do conteúdo deste tema.</p>';
    qs.forEach((q, i) => {
      const key = n + '|' + q.id;
      h += qCard(q, { modo:'pratica', rotulo:'Treino ' + (i + 1), key, sel:S.sel[key], estado:p.respostas[q.id], gab:q.gab });
    });
    if (S.erros['treino' + n]) h += '<p class="aviso erro" role="alert">' + esc(S.erros['treino' + n]) + '</p>';
    if (S.busy['t' + n]) h += '<div class="carregando" role="status"><span class="pulso" aria-hidden="true"></span><span>Criando questões. Leva até um minuto.</span><button type="button" class="link" data-act="parar" data-b="t' + n + '">Parar</button></div>';
    else if (visiveis < todas.length) h += '<button type="button" class="btn-sec" data-act="mais-treino" data-n="' + n + '">Mostrar mais questões</button>';
    else if (S.ia) h += '<button type="button" class="btn-sec" data-act="treino" data-n="' + n + '">' + (qs.length ? 'Criar mais 5 questões com o Claude' : 'Criar 5 questões com o Claude') + '</button>';
    else if (S.iaPronto && !qs.length) h += '<p class="nota">' + esc(msgErro({ code:'sem_ia' })) + '</p>';
    else if (qs.length) h += '<p class="nota">Você já viu todas as questões de treino deste tema. Os simulados misturam estas questões com as autoatividades.</p>';
  }
  return h;
}
