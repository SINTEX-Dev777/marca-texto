function viewSimulado(){
  const s = S.sim;
  if (!s) return '<a class="voltar" href="#simulados">' + ICON.voltar + 'Simulados</a><p>Nenhum simulado em andamento.</p>';
  const av = avaliacoes().find(a => a.id === s.id) || { nome:'Simulado' };
  let h = '<a class="voltar" href="#simulados">' + ICON.voltar + 'Simulados</a>';
  if (s.fase === 'preparando'){
    h += '<h1 class="tit-pag">' + esc(av.nome) + '</h1><div class="folha carregando-g" role="status"><span class="pulso" aria-hidden="true"></span><p>' + esc(s.msg || 'Preparando') + '</p><div class="barra"><span style="width:' + Math.round(100 * (s.passo - 1) / Math.max(1, s.total)) + '%"></span></div><p class="nota">Na primeira vez o Claude cria as questões de cada tema. Depois fica mais rápido.</p><button type="button" class="link" data-act="sim-parar">Parar</button></div>';
    return h;
  }
  if (s.fase === 'erro'){
    return h + '<h1 class="tit-pag">' + esc(av.nome) + '</h1><p class="aviso erro" role="alert">' + esc(s.msg) + '</p><button type="button" class="btn" data-act="sim-iniciar" data-id="' + s.id + '">Tentar de novo</button>';
  }
  if (s.fase === 'prova'){
    const x = s.qs[s.i], respondidas = Object.keys(s.resp).length;
    h += '<div class="sim-cab"><h1 class="tit-pag">' + esc(av.nome) + '</h1><p class="sim-pos">Questão ' + (s.i + 1) + ' de ' + s.qs.length + '</p>';
    h += '<div class="pontos" role="list">' + s.qs.map((_, i) => '<button type="button" role="listitem" class="ponto' + (s.resp[i] ? ' on' : '') + (i === s.i ? ' agora' : '') + '" data-act="sim-ir" data-i="' + i + '" aria-label="Questão ' + (i + 1) + (s.resp[i] ? ', respondida' : '') + '"></button>').join('') + '</div></div>';
    h += qCard(x.q, { modo:'prova', key:'sim', sel:s.resp[s.i], rotulo:'Tema ' + x.n + ': ' + tema(x.n).titulo });
    h += '<div class="sim-nav">';
    h += '<button type="button" class="btn-sec" data-act="sim-ant"' + (s.i === 0 ? ' disabled' : '') + '>Anterior</button>';
    if (s.i < s.qs.length - 1) h += '<button type="button" class="btn" data-act="sim-prox">Próxima</button>';
    else h += '<button type="button" class="btn" data-act="sim-entregar">Entregar simulado</button>';
    h += '</div>';
    if (s.i === s.qs.length - 1 && respondidas < s.qs.length) h += '<p class="nota">' + (s.qs.length - respondidas) + ' sem resposta. Você pode voltar pelos quadradinhos acima.</p>';
    return h;
  }
  // resultado
  const errados = s.qs.filter(x => !x.ok);
  const temasRev = [...new Set(errados.map(x => x.n))];
  h += '<section class="abre"><h1>Você acertou ' + s.acertos + ' de ' + s.qs.length + '</h1><p class="abre-sub">' + (s.acertos >= 7 ? 'Bom resultado. Revise as erradas para fechar as lacunas.' : 'Revise as erradas: cada uma mostra a página do livro para reler.') + '</p></section>';
  if (temasRev.length) h += '<p class="revisar">Temas para revisar: ' + temasRev.map(n => '<a href="#tema-' + n + '">Tema ' + n + '</a>').join(', ') + '</p>';
  h += '<ol class="rev">';
  s.qs.forEach((x, i) => {
    h += '<li><details' + (x.ok ? '' : ' open') + '><summary><span class="rev-st ' + (x.ok ? 'ok' : 'nao') + '">' + (x.ok ? 'Certa' : 'Errada') + '</span> Questão ' + (i + 1) + ', Tema ' + x.n + '</summary>' + qCard(x.q, { modo:'revisao', key:'rev' + i, sel:s.resp[i], gab:gabDe(x.q, x.n) }) + '</details></li>';
  });
  h += '</ol><div class="sim-nav"><button type="button" class="btn" data-act="sim-iniciar" data-id="' + s.id + '">Fazer outro simulado</button></div>';
  return h;
}

function viewAjustes(){
  let h = '<a class="voltar" href="#hoje">' + ICON.voltar + 'Hoje</a><h1 class="tit-pag">Ajustes</h1>';
  h += '<section class="folha ajs"><h2>Sincronizar celular e PC</h2><div id="sync-box">' + syncCorpo() + '</div></section>';
  h += '<section class="folha ajs"><label for="data-prova">Data da prova</label><input type="date" id="data-prova" value="' + esc(S.config.dataProva) + '" data-ch="data-prova">';
  if (S.material) h += '<label for="data-inicio">Início do plano de estudo</label><input type="date" id="data-inicio" value="' + esc(S.config.inicio) + '" data-ch="data-inicio"><p class="nota">Os temas são distribuídos entre o início do plano e dois dias antes da prova. Os dois últimos dias ficam para revisão.</p>';
  h += '</section>';
  if (S.material){
    const m = S.material;
    h += '<section class="folha ajs"><h2>Material</h2><p>' + esc(m.nome) + '</p><p class="nota">' + m.totalPaginas + ' páginas, ' + m.temas.length + ' temas' + (m.formatoLivro ? ', ' + m.temas.reduce((a, t) => a + t.questoes.length, 0) + ' autoatividades' : '') + '.</p>';
    if (S.confirmar === 'trocar') h += '<p class="aviso erro">Trocar o material apaga o progresso e as questões criadas para este. Confirma?</p><div class="linha"><button type="button" class="btn perigo" data-act="trocar-sim">Sim, trocar</button><button type="button" class="btn-sec" data-act="cancelar">Cancelar</button></div>';
    else h += '<button type="button" class="btn-sec" data-act="trocar">Trocar material</button>';
    h += '</section>';
    h += '<section class="folha ajs"><h2>Apagar tudo</h2><p class="nota">Remove o material, o progresso e as questões salvas neste navegador.</p>';
    if (S.confirmar === 'apagar') h += '<div class="linha"><button type="button" class="btn perigo" data-act="apagar-sim">Apagar tudo</button><button type="button" class="btn-sec" data-act="cancelar">Cancelar</button></div>';
    else h += '<button type="button" class="btn-sec" data-act="apagar">Apagar dados</button>';
    h += '</section>';
  }
  if (S.emb) h += '<section class="folha ajs"><h2>Conteúdo do livro</h2><p>Seu livro foi reconhecido. As pistas, o gabarito comentado das autoatividades e as questões de treino já vêm prontos e funcionam sem internet depois de carregados.' + (S.ia ? ' O Claude está conectado e pode criar questões extras.' : '') + '</p></section>';
  else h += '<section class="folha ajs"><h2>Claude</h2><p>' + (!S.iaPronto ? 'Conectando…' : S.ia ? 'Conectado. As pistas, correções e questões usam a sua conta do Claude.' : 'Indisponível nesta página. O gabarito do próprio livro funciona mesmo assim, quando ele estiver no PDF.') + '</p></section>';
  h += '<section class="folha ajs"><h2>Usar como app no Android</h2><p>No Chrome, abra o menu de três pontos e toque em <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong>. O Marca-texto ganha um ícone como qualquer app.</p></section>';
  return h;
}

/* ---------- render + rotas ---------- */
function rota(){ return (location.hash || '#hoje').slice(1) || 'hoje'; }
function render(){
  if (!S.config) return;
  const r = rota(); let html, aba = 'hoje';
  if (r === 'temas'){ html = viewTemas(); aba = 'temas'; }
  else if (/^tema-\d+$/.test(r)){ html = viewTema(+r.split('-')[1]); aba = 'temas'; }
  else if (r === 'simulados'){ html = viewSimulados(); aba = 'sim'; }
  else if (r === 'simulado'){ html = viewSimulado(); aba = 'sim'; }
  else if (r === 'ajustes'){ html = viewAjustes(); aba = ''; }
  else html = viewHoje();
  $('#main').innerHTML = html;
  document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.aba === aba) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (S.up && S.up.fase === 'lendo') progressoLeitura();
}

const ACOES = {
  etapa: b => marcarEtapa(+b.dataset.n, b.dataset.e),
  pistas: b => pedirPistas(+b.dataset.n),
  achei: b => { const p = pt(+b.dataset.n); p.achadas = [...new Set([...(p.achadas || []), +b.dataset.i])]; salvarProg(); render(); },
  escolher: b => { S.sel[b.dataset.k] = b.dataset.l; delete S.erros[b.dataset.k]; render(); },
  conferir: b => conferir(b.dataset.k),
  treino: b => pedirTreino(+b.dataset.n),
  'mais-treino': b => { const p = pt(+b.dataset.n); p.mostrar = (p.mostrar || 3) + 3; salvarProg(); render(); },
  parar: b => { const c = S.busy[b.dataset.b]; if (c && c.abort) c.abort(); },
  'sim-iniciar': b => iniciarSimulado(b.dataset.id),
  'sim-parar': () => { if (S.sim && S.sim.ctl) S.sim.ctl.abort(); },
  'sim-escolher': b => { S.sim.resp[S.sim.i] = b.dataset.l; render(); },
  'sim-prox': () => { S.sim.i = Math.min(S.sim.qs.length - 1, S.sim.i + 1); render(); window.scrollTo(0, 0); },
  'sim-ant': () => { S.sim.i = Math.max(0, S.sim.i - 1); render(); window.scrollTo(0, 0); },
  'sim-ir': b => { S.sim.i = +b.dataset.i; render(); },
  'sim-entregar': () => entregar(),
  'sync-conectar': () => {
    const v = (document.getElementById('sync-token') || {}).value || '';
    const tok = v.trim();
    if (!tok){ SY.erro = 'Cole o token do GitHub antes de conectar.'; atualizarSyncUI(); return; }
    SY.token = tok; SY.gist = ''; SY.erro = ''; lsSet('mt-token', tok); lsSet('mt-gist', '');
    atualizarSyncUI(); sincronizar();
  },
  'sync-agora': () => sincronizar(),
  'sync-sair': () => { SY.token = ''; SY.gist = ''; SY.erro = ''; SY.ultima = ''; lsSet('mt-token', ''); lsSet('mt-gist', ''); lsSet('mt-ultima', ''); atualizarSyncUI(); },
  trocar: () => { S.confirmar = 'trocar'; render(); },
  apagar: () => { S.confirmar = 'apagar'; render(); },
  cancelar: () => { S.confirmar = null; render(); },
  'trocar-sim': async () => { S.confirmar = null; S.material = null; S.emb = null; S.up = null; await idb.set('material', null); location.hash = '#hoje'; render(); },
  'apagar-sim': async () => {
    S.confirmar = null; await idb.clear();
    S.material = null; S.emb = null; S.analise = {}; S.treino = {}; S.sel = {}; S.sim = null; S.up = null;
    S.prog = { temas:{}, simulados:{}, usadas:[] };
    S.config = { dataProva:'2026-11-24', inicio:hojeISO() };
    await idb.set('config', S.config);
    location.hash = '#hoje'; render();
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACOES[b.dataset.act]; if (f){ e.preventDefault(); f(b); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'arquivo' && el.files && el.files[0]) lerPdf(el.files[0]);
  if (el.dataset && el.dataset.ch === 'data-prova' && el.value){ S.config.dataProva = el.value; S.config.atualizado = Date.now(); idb.set('config', S.config); agendarSync(500); }
  if (el.dataset && el.dataset.ch === 'data-inicio' && el.value){ S.config.inicio = el.value; S.config.atualizado = Date.now(); idb.set('config', S.config); agendarSync(500); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.et) S.abertos[d.dataset.et] = d.open; }, true);
window.addEventListener('hashchange', () => { S.confirmar = null; render(); window.scrollTo(0, 0); });

async function iniciar(){
  try {
    S.config = await idb.get('config') || { dataProva:'2026-11-24', inicio:hojeISO() };
    S.material = await idb.get('material') || null;
    S.prog = await idb.get('progresso') || { temas:{}, simulados:{}, usadas:[] };
    S.prog.temas = S.prog.temas || {}; S.prog.simulados = S.prog.simulados || {}; S.prog.usadas = S.prog.usadas || [];
    if (S.material) for (const t of S.material.temas){
      const a = await idb.get('ia:analise:' + t.n); if (a) S.analise[t.n] = a;
      const tr = await idb.get('ia:treino:' + t.n); if (tr) S.treino[t.n] = tr;
    }
    aplicarDados();
  } catch (e) {
    S.config = S.config || { dataProva:'2026-11-24', inicio:hojeISO() };
    S.prog = S.prog || { temas:{}, simulados:{}, usadas:[] };
  }
  render();
  iniciarIA();
  if (SY.token) sincronizar();
}
iniciar();
document.addEventListener('visibilitychange', () => { if (!SY.token) return; if (document.visibilityState === 'visible') sincronizar(); else { clearTimeout(SY.t); sincronizar(); } });
window.addEventListener('online', () => { if (SY.token) sincronizar(); });

/* PWA: só quando hospedado fora do Claude (ex.: GitHub Pages) */
(function(){
  try {
    const h = location.hostname;
    if (location.protocol !== 'https:' || /claude\.ai$|claude\.site$|claudeusercontent|anthropic/.test(h)) return;
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
    const i = document.createElement('link'); i.rel = 'apple-touch-icon'; i.href = 'icon-192.png'; document.head.appendChild(i);
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  } catch (e) {}
})();

</script>
